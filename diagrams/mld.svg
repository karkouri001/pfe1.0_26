  <text class="field" x="52" y="282">nom</text>
  <text class="field" x="52" y="300">annee_academique</text>

  <!-- Groupe Membres -->
  <rect class="box" x="320" y="220" width="240" height="110" rx="6" />
  <text class="title" x="332" y="242">GROUPE_MEMBRES</text>
  <text class="field" x="332" y="264">id (PK)</text>
  <text class="field" x="332" y="282">groupe_id (FK)</text>

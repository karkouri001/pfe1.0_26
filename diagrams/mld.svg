  <!-- Relationships -->
  <line class="line" x1="280" y1="80" x2="320" y2="80" />
  <text class="label" x="286" y="72">1-1</text>

  <line class="line" x1="280" y1="260" x2="320" y2="260" />
  <text class="label" x="286" y="252">1-N</text>

  <line class="line" x1="160" y1="330" x2="160" y2="400" />
  <text class="label" x="170" y="370">1-N</text>

  <line class="line" x1="180" y1="470" x2="360" y2="470" />
  <text class="label" x="250" y="458">N-N</text>

  <line class="line" x1="320" y1="500" x2="660" y2="500" />
  <text class="label" x="500" y="488">1-N</text>

  <line class="line" x1="940" y1="480" x2="980" y2="480" />
  <text class="label" x="946" y="472">1-1</text>

  <line class="line" x1="720" y1="160" x2="720" y2="400" />
  <text class="label" x="730" y="260">1-N</text>
</svg>

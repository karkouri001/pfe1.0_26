  <text class="field" x="52" y="498">heure_debut</text>
  <text class="field" x="52" y="516">heure_fin</text>
  <text class="field" x="52" y="534">url_tests_git</text>
  <text class="field" x="52" y="552">hash_tests</text>
  <text class="field" x="52" y="570">pdf_examen</text>

  <!-- Examen Groupes -->
  <rect class="box" x="360" y="420" width="240" height="110" rx="6" />

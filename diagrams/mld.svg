<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    .box { fill: #f8f9fb; stroke: #333; stroke-width: 1.5; }
    .title { font: bold 14px Arial, sans-serif; }
    .field { font: 12px Arial, sans-serif; }
    .line { stroke: #333; stroke-width: 1.2; }
    .label { font: 11px Arial, sans-serif; fill: #222; }
  </style>

  <!-- AuthUser -->
  <rect class="box" x="40" y="40" width="240" height="140" rx="6" />
  <text class="title" x="52" y="62">AUTH_USER</text>
  <text class="field" x="52" y="84">id (PK)</text>
  <text class="field" x="52" y="102">username</text>
  <text class="field" x="52" y="120">email</text>
  <text class="field" x="52" y="138">password</text>

  <!-- Profil -->
  <rect class="box" x="320" y="40" width="220" height="110" rx="6" />
  <text class="title" x="332" y="62">PROFIL</text>
  <text class="field" x="332" y="84">id (PK)</text>
  <text class="field" x="332" y="102">utilisateur_id (FK)</text>
  <text class="field" x="332" y="120">role</text>

  <!-- Journal Audit -->
  <rect class="box" x="600" y="40" width="240" height="120" rx="6" />
